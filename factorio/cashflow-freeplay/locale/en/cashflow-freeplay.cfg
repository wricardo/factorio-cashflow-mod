[entity-description]
cf-freeplay-controller=Owns an independent Cashflow account and its linked stations.
cf-freeplay-income=Chest holds the month's planned iron income and releases it steadily to the belt.
cf-freeplay-expense=Chest holds the month's planned copper bills and releases them steadily to the belt.
cf-freeplay-cashflow=Chest holds incoming iron cash and copper bills; one of each is consumed when matched.
cf-freeplay-debt=Chest displays outstanding debt as copper plates; accepts copper borrowing and iron repayment.
cf-freeplay-vault=Chest stores invested iron plates and emits asset returns.

