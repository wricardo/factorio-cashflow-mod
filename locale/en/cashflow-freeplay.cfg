hint-smelter=Load coal and belt [item=iron-plate] CASH OUT to a Cashflow Station's CASH IN. Salary is paid once a month after the smelt.
hint-cashflow=[item=iron-plate] CASH IN and [item=copper-plate] BILLS IN are matched one to one. Belt SURPLUS OUT to an Investment Account's DEPOSIT IN and UNPAID OUT to a Debt Station's BORROW IN.
hint-debt=[item=iron-plate] PAY IN pays debt down; [item=copper-plate] BORROW IN adds to it. Belt INTEREST OUT to a Cashflow Station's BILLS IN.
hint-vault=Belt surplus cash to [item=iron-plate] DEPOSIT IN. Belt RETURN OUT to a Cashflow Station's CASH IN.
