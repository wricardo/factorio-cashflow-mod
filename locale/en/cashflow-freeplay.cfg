[mod-setting-description]
cf-freeplay-month-seconds=How long one game month lasts. A year is 12 months. Each Income, Active Income or Expense station is limited to $20,000 a month at any length; plates leave a station at belt speed, so a short month may not have time to move that many (a blue belt moves about 45 plates a second).

